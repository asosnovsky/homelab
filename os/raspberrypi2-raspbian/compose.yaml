version: "3.8"
services:
  dockge:
    image: louislam/dockge:1
    restart: unless-stopped
    ports:
      - 5050:5001
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/homelab/data:/app/data
      - /opt/homelab/stacks:/opt/homelab/stacks
    environment:
      - DOCKGE_STACKS_DIR=/opt/homelab/stacks