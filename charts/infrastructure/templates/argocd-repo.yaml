---
apiVersion: v1
kind: Secret
metadata:
  labels:
    argocd.argoproj.io/secret-type: repository
  name: homelab
  namespace: plugin-argo-cd
type: Opaque
stringData:
    name: homelab
    type: git
    username: git
    url: git@github.com:{{ .Values.gitops.repo }}.git
data:
  sshPrivateKey: "{{ .Values.gitops.sshkey | b64enc }}"