{{ range $serviceName, $service := .Values.services -}}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: "{{ $.Release.Name }}-{{ $serviceName }}"
  namespace: {{ $.Release.Namespace }}
  annotations:
    ingress.kubernetes.io/ssl-redirect: "false"
spec:
  # tls:
  #   - secretName: "homelab.{{ $.Release.Name }}.cert.{{ $serviceName }}"
  #     hosts:
  #       - {{ $service.host }}
  rules:
  - host: {{ $service.host }}
    http:
      paths:
      - backend:
          service:
            name: {{ $serviceName }}
            port: 
            {{- $service.port | default (dict "port" 80) | toYaml | nindent 14 }}
        path: {{ $service.path | default "/" }}
        pathType: Prefix
---
# apiVersion: cert-manager.io/v1
# kind: Issuer
# metadata:
#   name: "{{ $.Release.Name }}-{{ $serviceName }}"
#   namespace: {{ $.Release.Namespace }}
# spec:
#   acme:
#     server: {{ $.Values.acme_server }}
#     email: {{ $.Values.email }}
#     skipTLSVerify: {{ $.Values.skipTLSVerify }}
#     privateKeySecretRef:
#       name: "homelab.{{ $.Release.Name }}.cert.{{ $serviceName }}"
#     solvers:
#     - http01:
#         ingress:
#           name: "{{ $.Release.Name }}-{{ $serviceName }}"
{{ end }}
