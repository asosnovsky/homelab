{{ range $serviceName, $service := .Values.services -}}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: "{{ $.Release.Name }}-{{ $serviceName }}"
  namespace: {{ $.Release.Namespace }}
  annotations:
  {{  if $.Values.tlsEnable  }}
    cert-manager.io/cluster-issuer: letsencrypt
  {{- end }}
spec:
  {{- if $.Values.tlsEnable }}
  tls:
    - secretName: "homelab.{{ $.Release.Name }}.cert.{{ $serviceName }}"
      hosts:
        - {{ $service.host }}
  {{- end }}
  rules:
  - host: {{ $service.host }}
    http:
      paths:
      - backend:
          service:
            name: {{ $serviceName }}
            port: 
            {{- $service.port | default (dict "port" 80) | toYaml | nindent 14 }}
        path: {{ $service.path | default "/" }}
        pathType: Prefix
{{ end }}
