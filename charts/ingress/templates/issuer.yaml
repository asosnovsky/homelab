{{  if $.Values.tlsEnable  }}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
    name: letsencrypt
spec:
    acme:
        server: {{ $.Values.acmeServer }}
        skipTLSVerify: {{ $.Values.skipTLSVerify }}
        email: {{ $.Values.email }}
        privateKeySecretRef:
            name: letsencrypt
        solvers:
        - http01:
            ingress:
                class: traefik
{{ end }}