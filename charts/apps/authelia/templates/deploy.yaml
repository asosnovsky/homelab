---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: authelia-config
spec:
  resources:
    requests:
      storage: 10M
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authelia
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: authelia
  template:
    metadata:
      labels:
        app.kubernetes.io/name: authelia
      annotations:
        checksums/config: "{{ (tpl (.Values.authelia | toYaml) .) | sha256sum }}"
    spec:
      enableServiceLinks: false
      volumes:
        - name: config-data
          persistentVolumeClaim:
            claimName: authelia-config
        - name: config-yaml
          configMap:
            name: authelia-config
            defaultMode: 0400
        # - name: files
        #   secret:
        #     secretName: authelia-files
        #     defaultMode: 0400
      initContainers:
        - name: setup-script
          image: "{{ .Values.authelia.image }}"
          envFrom:
            - secretRef:
                name: authelia-db-secrets
            - secretRef:
                name: authelia-redis-secrets
            - secretRef:
                name: authelia-secrets
          volumeMounts:
            - mountPath: "/config"
              name: config-data
            - mountPath: /config/configuration.yml
              subPath: configuration.yml
              name: config-yaml
            # - mountPath: /config/assets/
            #   name: files
          command: ["sh"]
          args:
            - "/config/assets/start_up.sh"
      containers:
        - name: authelia
          image: "{{ .Values.authelia.image }}"
          envFrom:
            - secretRef:
                name: authelia-db-secrets
            - secretRef:
                name: authelia-redis-secrets
            - secretRef:
                name: authelia-secrets
          volumeMounts:
            - mountPath: "/config"
              name: config-data
            - mountPath: /config/configuration.yml
              subPath: configuration.yml
              name: config-yaml
            - mountPath: /config/assets/
              name: files
          resources:
            requests:
              memory: "1Gi"
              cpu: "1"
            limits:
              memory: "1Gi"
              cpu: "1"
          ports:
            - containerPort: 80
            {{ if .Values.authelia.enableAdminUI }}
            - containerPort: 9092
            {{ end }}
---
kind: Service
apiVersion: v1
metadata:
  name: authelia
spec:
  selector:
    app.kubernetes.io/name: "authelia"
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 80
    {{ if .Values.authelia.enableAdminUI }}
    - name: admin
      port: 9092
      targetPort: 9092
    {{ end }}