
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: "nfs-storage"
  namespace: {{ .Values.ns.argocd }}
spec:
    project: main
    source:
        repoURL: https://github.com/asosnovsky/nfs-subdir-external-provisioner
        targetRevision: HEAD
        path: 'charts/nfs-subdir-external-provisioner'
        helm:
            valueFiles:
                - values.yaml
            values: |-
                storageClass: 
                    name: {{ .Values.global.nfs.storageClassName }}
                nfs:
                    {{ .Values.global.nfs.storageProvider | toYaml | nindent 22 }}
    destination:
        namespace: plugin-nfs-storage
        server: https://kubernetes.default.svc
    syncPolicy:
        automated:
          prune: false
          selfHeal: true