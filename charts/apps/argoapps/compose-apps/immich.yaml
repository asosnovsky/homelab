services:
  immich-server:
    image: ghcr.io/immich-app/immich-server:v2
    volumes:
      upload: /usr/src/app/upload
      family-storage: /family-storage
    envFrom:
      - secretRef:
          name: immich-shared
    ports:
      - port: "2283"
    restart: always
    environment:
      REDIS_PORT: "6379"

  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:v2
    volumes:
      model-cache: /cache
    envFrom:
      - secretRef:
          name: immich-shared
    restart: always
    environment:
      REDIS_PORT: "6379"
    ports:
      - port: "3003"

  redis:
    image: docker.io/valkey/valkey:8-bookworm@sha256:fea8b3e67b15729d4bb70589eb03367bab9ad1ee89c876f54327fc7c6e618571
    healthcheck:
      test: redis-cli ping || exit 1
    restart: always
    ports:
      - port: "6379"

  database:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:41eacbe83eca995561fe43814fd4891e16e39632806253848efaf04d3c8a8b84
    environment:
      POSTGRES_INITDB_ARGS: "--data-checksums"
    ports:
      - port: "5432"
    envFrom:
      - secretRef:
          name: immich-shared
    volumes:
      db-data: /var/lib/postgresql/data
    restart: always
    healthcheck:
      interval: 5m
      start_interval: 30s
      start_period: 5m
      test: 'pg_isready --dbname="$${POSTGRES_DB}" --username="$${POSTGRES_USER}" || exit 1; '

volumes:
  model-cache:
  db-data:
    type: nfs-provider
    size: 200Mi
  upload:
    type: nfs-provider
  family-storage:
    type: nfs
    server: tnas1.lab.internal
    path: /mnt/EightTerra/FamilyStorage

secrets:
  immich-shared:
    - name: DB_USERNAME
      aliases:
        - POSTGRES_USER
      value: immich
    - name: DB_DATABASE_NAME
      aliases:
        - POSTGRES_DB
      value: immich
    - name: DB_HOSTNAME
      value: database
    - name: REDIS_HOSTNAME
      value: redis

externalSecrets:
  generators:
    db-password:
      length: 16
      digits: 5
      symbols: 5
      symbolCharacters: "-_$@"
      noUpper: false
      allowRepeat: true
  secrets:
    db-password:
      refreshPolicy: "CreatedOnce"
      target:
        name: immich-shared
        creationPolicy: Merge
        deletionPolicy: Merge
        template:
          engineVersion: v2
          data:
            POSTGRES_PASSWORD: "{{`{{.password}}`}}"
            DB_PASSWORD: "{{`{{.password}}`}}"
      dataFrom:
        - sourceRef:
            generatorRef:
              apiVersion: generators.external-secrets.io/v1alpha1
              kind: Password
              name: "db-password"
ingress:
  enabled: true
  prefix: immich
  service: immich-server
  port: 2283
  middleware: ingress-https-redirect
  annotations:
    traefik.ingress.kubernetes.io/service.serverstransport: ingress-immich-transport@kubernetescrd
