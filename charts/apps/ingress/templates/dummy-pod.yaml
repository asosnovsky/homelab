---
kind: Deployment
apiVersion: apps/v1
metadata:
  name: dummy-app
  namespace: "{{ .Release.Namespace }}"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dummy
  template:
    metadata:
      labels:
        app: dummy
    spec:
      containers:
        - name: name
          image: nginxdemos/hello
          resources:
            limits:
              memory: 1Gi
          ports:
            - containerPort: 80
---
kind: Service
apiVersion: v1
metadata:
  name: dummy-app
spec:
  selector:
    app: dummy
    release: "{{ .Release.Name }}"
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 80