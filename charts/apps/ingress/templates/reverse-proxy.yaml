{{ range $prefix, $data := .Values.reverseProxy }}
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: "reverse-proxy-{{$prefix}}"
  labels:
    kubernetes.io/service-name: "reverse-proxy-{{$prefix}}"
addressType: IPv4
ports:
- port: {{ $data.port | default 80 }}
  protocol: TCP
endpoints:
- addresses:
  - "{{ $data.ip }}"
  conditions:
    ready: true
---
apiVersion: v1
kind: Service
metadata:
  name: "reverse-proxy-{{$prefix}}"
spec:
  type: ClusterIP
  ports:
  - port: 80
    protocol: TCP
    targetPort: {{ $data.port | default 80 }}

{{ if (not $data.disableIngress) }}
{{- $ingressDef := (dict "service" (printf "reverse-proxy-%s" $prefix) "prefix" $prefix "global" $.Values.global "namespace" $.Release.Namespace "group" "Reverse Proxies" ) -}}
{{- $ingressDef := (merge ($data.overrides | default (dict)) $ingressDef) -}}

{{ include "homelab.ingress" $ingressDef}}

{{ end }}

{{ if $data.useTailscale }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
    name: tailscale-{{ $prefix }}
    namespace: {{ $.Release.Namespace }}
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
        - {{ $prefix }}
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: "reverse-proxy-{{$prefix}}"
                port:
                  number: 80
{{ end }}

{{ end }}
