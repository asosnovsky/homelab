---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: https-redirect
  namespace: "{{ .Release.Namespace }}"
spec:
  redirectScheme:
    scheme: https

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strict-transport
  namespace: "{{ .Release.Namespace }}"
spec:
  headers:
    hostsProxyHeaders:
      - "X-Forwarded-Host"
    referrerPolicy: "same-origin"
    stsSeconds: 15552000
    stsIncludeSubdomains: true
    stsPreload: true
    forceSTSHeader: true

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: buffering
  namespace: "{{ .Release.Namespace }}"
spec:
  buffering:
    maxRequestBodyBytes: 52428800000   # 50000M in bytes
    memRequestBodyBytes: 1048576       # 1024k client_body_buffer_size
    maxResponseBodyBytes: 0            # unlimited
    retryExpression: ""

---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: immich-transport
  namespace: "{{ .Release.Namespace }}"
spec:
  forwardingTimeouts:
    responseHeaderTimeout: 600s
    idleConnTimeout: 600s
    dialTimeout: 30s

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: immich-chain
  namespace: "{{ .Release.Namespace }}"
spec:
  chain:
    middlewares:
      - name: immich-buffering
      - name: https-redirect
