{{ range $user, $pass := .Values.users }}
---
apiVersion: v1
kind: Secret
metadata:
  name: "secret-basic-auth-{{$user}}"
type: kubernetes.io/basic-auth
stringData:
  username: {{ $user }}
  password: {{ $pass }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: "basic-auth-{{$user}}"
spec:
  redirectScheme:
    scheme: https
  basicAuth:
    secret: "secret-basic-auth-{{$user}}"
{{ end }}
