---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: "torrent-client"
  namespace: {{ .Values.ns.argocd }}
spec:
    project: main
    source:
        path: 'charts/torrents'
        repoURL: "git@github.com:asosnovsky/helm-charts.git"
        targetRevision: main
        helm:
            values: |-
                gluetun:
                    envFrom:
                        - secretRef:
                            name: vpn-credentials
                volumes:
                    -   name: "torrents"
                        nfs:
                            server: tnas1.lab.internal
                            path: /mnt/EightTerra/DownloadedTorrents
                    -   name: "transmission"
                        persistentVolumeClaim:
                            claimName: "transmission-config"
                    -   name: "qbittorrent"
                        persistentVolumeClaim:
                            claimName: "qbittorrent-config"
                transmission:
                    volumeMounts:
                        -   name: torrents
                            mountPath: /torrents
                        -   name: transmission
                            mountPath: /config
                qbittorrent:
                    volumeMounts:
                        -   name: torrents
                            mountPath: /torrents
                        -   name: qbittorrent
                            mountPath: /config
    destination:
        namespace: {{ .Release.Namespace }}
        server: https://kubernetes.default.svc
    syncPolicy:
        automated:
            prune: true
            selfHeal: true