image:
  repository: nextcloud
  tag: 24.0.3-apache
  pullPolicy: IfNotPresent

replicaCount: 1

nextcloud:
  existingSecret:
    enabled: true
    usernameKey: username
    passwordKey: password
  update: 0
  defaultConfigs:
    .htaccess: true
    redis.config.php: true
    apache-pretty-urls.config.php: true
    apcu.config.php: true
    apps.config.php: false
    autoconfig.php: true
    smtp.config.php: true
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

internalDatabase:
  enabled: false

externalDatabase:
  enabled: true
  type: postgresql
  database: nextcloud
  existingSecret:
    enabled: true
    usernameKey: username
    passwordKey: password

exernalRedis:
  enabled: false
  auth:
    enabled: true
    existingSecretPasswordKey: password

cronjob:
  enabled: true

persistence:
  enabled: true

resources:
  requests:
   cpu: 100m
   memory: 512Mi
  limits:
   cpu: 2
   memory: 1Gi

hpa:
  enabled: true
  cputhreshold: 60
  minPods: 1
  maxPods: 5
