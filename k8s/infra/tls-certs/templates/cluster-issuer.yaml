{{  if .Values.global.tls.enabled  }}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
    name: {{ .Values.global.tls.issuer }}
spec:
    acme:
        server: {{ .Values.acmeServer }}
        skipTLSVerify: {{ .Values.skipTLSVerify }}
        email: {{ .Values.global.email }}
        privateKeySecretRef:
            name: {{ .Values.global.tls.issuer }}
        solvers:
        - http01:
            ingress:
                class: traefik
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: tls-{{ .Values.global.tls.issuer }}
spec:
  secretName: {{ .Values.global.tls.secretName }}
  issuerRef: 
    kind: ClusterIssuer
    name: {{ .Values.global.tls.issuer }}
  commonName: "*.{{ .Values.global.domain }}"
  dnsNames:
    - "*.{{ .Values.global.domain }}"
---
apiVersion: traefik.containo.us/v1alpha1
kind: TLSStore
metadata:
  name: tls-{{ .Values.global.tls.issuer }}
spec:
  defaultCertificate:
    secretName: {{ .Values.global.tls.secretName }}
{{ end }}