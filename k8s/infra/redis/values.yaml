redis:
  fullnameOverride: "redis"

  image:
    tag: 7.0.7-debian-11-r7
    repository: bitnami/redis
    pullPolicy: IfNotPresent

  auth:
    enabled: true
    existingSecret: redis.password
    existingSecretPasswordKey: password

  architecture: standalone

  master:
    count: 1
    persistence:
      enabled: true
      path: /data

  replica:
    replicaCount: 0
