---
kind: Deployment
apiVersion: apps/v1
metadata:
  name: dummy-app
  namespace: "{{ .Release.Namespace }}"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dummy
      release: "{{ .Release.Name }}"
  template:
    metadata:
      labels:
        app: dummy
        release: "{{ .Release.Name }}"
    spec:
      containers:
        - name: name
          image: nginxdemos/hello
          resources:
            limits:
              cpu: 1
              memory: 1Gi
          ports:
            - containerPort: 80
---
kind: Service
apiVersion: v1
metadata:
  name: dummy-app
spec:
  selector:
    app: dummy
    release: "{{ .Release.Name }}"
  type: LoadBalancer
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dummy-app
  labels:
    name: dummy-app
spec:
  rules:
    - host: "demo.{{ .Values.global.domain }}"
      http:
        paths:
          - pathType: Prefix
            path: "/"
            backend:
              service:
                name: dummy-app
                port:
                  number: 80
