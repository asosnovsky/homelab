{{ range $prefix, $data := .Values.reverseProxy }}
---
apiVersion: v1
kind: Endpoints
metadata:
  name: "reverse-proxy-{{$prefix}}"
subsets:
- addresses:
  - ip: "{{ $data.ip }}"
  ports:
  - port: {{ $data.port }}
    protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: "reverse-proxy-{{$prefix}}"
spec:
  type: ClusterIP
  ports:
  - port: 80
    protocol: TCP
    targetPort: {{ $data.port }}

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: "reverse-proxy-{{$prefix}}"
  annotations:
    homelab/ingress-type: "reverse-proxy"
spec:
  rules:
  - host: "{{$prefix}}.{{$.Values.global.domain}}"
    http:
      paths:
      - backend:
          service:
            name: "reverse-proxy-{{$prefix}}"
            port:
              number: 80
        path: /
        pathType: Prefix
{{ end }}