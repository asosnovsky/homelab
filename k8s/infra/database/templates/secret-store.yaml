---
apiVersion: external-secrets.io/v1beta1
kind: CLusterSecretStore
metadata:
  name: database
spec:
  provider:
    kubernetes:
      remoteNamespace: database
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: "default"
