---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: "{{ .Values.authelia.secret.existingSecret }}"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: database
  target:
    name: "{{ .Values.authelia.secret.existingSecret }}"
  data:
    - secretKey: "password"
      remoteRef:
        key: "password.pg.authelia"
        property: password
