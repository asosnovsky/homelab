authelia:
  domain: "home.sosnovsky.ca"
  configMap:
    default_redirection_url: "https://auth.core.home.sosnovsky.ca"
    notifier:
      disable_startup_check: false
      smtp:
        enabled: false
        enabledSecret: true
        username: ariel.sosnovsky@gmail.com
        sender: ariel.sosnovsky@gmail.com
        identifier: ariel.sosnovsky@gmail.com
        host: smtp.gmail.com
        port: 587
      filesystem:
        enabled: true
  ingress:
    enabled: true
    certManager: true
    className: traefik
    subdomain: auth.core
    tls:
      enabled: true
      secret: authelia-tls
    traefikCRD:
      enabled: true
      disableIngressRoute: true
      sticky: true
