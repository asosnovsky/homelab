authelia:
  domain: "home.sosnovsky.ca"
  configMap:
    default_redirection_url: "https://auth.core.home.sosnovsky.ca"
    notifier:
      disable_startup_check: false
      smtp:
        enabled: true
        enabledSecret: false
        host: postfix.authelia.svc.cluster.local
        port: 25
        sender: ariel.sosnovsky@gmail.com
        startup_check_address: ariel.sosnovsky@gmail.com
        disable_require_tls: true
        # username: ariel.sosnovsky@gmail.com
        # identifier: ariel.sosnovsky@gmail.com
        # host: smtp.gmail.com
        # port: 587
      filesystem:
        enabled: false
  ingress:
    enabled: true
    certManager: true
    className: traefik
    subdomain: auth.core
    tls:
      enabled: true
      secret: authelia-tls
    traefikCRD:
      enabled: true
      disableIngressRoute: true
      sticky: true
smtp_configs:
  SMTP_SERVER: "smtp-relay.gmail.com"
  SMTP_PORT: "587"
  SMTP_USERNAME: "ariel.sosnovsky@gmail.com"
