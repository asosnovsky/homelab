{{  if .Values.global.tls.enabled  }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: "authentik-tls"
spec:
  secretName: "authentik-tls"
  issuerRef: 
    kind: ClusterIssuer
    name: "{{ .Values.global.tls.issuer }}"
  commonName: "authentik.core.{{.Values.global.domain}}"
  dnsNames:
    - "authentik.core.{{.Values.global.domain}}"
{{ end }}
