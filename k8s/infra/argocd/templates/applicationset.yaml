# kind: Application
# metadata:
#   name: "{{ .Release.Name }}"
#   namespace: "{{ .Release.Namespace }}"
# spec:
#   project: default
#   source:
#     repoURL: "git@github.com:{{ .Values.selfapp.repo }}.git"
#     targetRevision: "{{ .Values.selfapp.commit }}"
#     path: k8s/infra/argocd
#     helm:
#       parameters:
#       - name: "selfapp.sshkey"
#         value: {{ .Values.selfapp.sshkey | quote }}
#   destination:
#     server: https://kubernetes.default.svc
#     namespace: "{{ .Release.Namespace }}"
#   # syncPolicy:
#   #   automated: 
#   #     prune: false
#   #     selfHeal: true
#   #     allowEmpty: true
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: "infra"
  namespace: "{{ .Release.Namespace }}"
spec:
  generators:
  - git:
      repoURL: "git@github.com:{{ .Values.selfapp.repo }}.git"
      revision: "{{ .Values.selfapp.commit }}"
      directories:
      - path: k8s/infra/*
  template:
    metadata:
      name: '{{ `{{path.basename}}` }}'
    spec:
      project: "infra"
      source:
        repoURL: "git@github.com:{{ .Values.selfapp.repo }}.git"
        targetRevision: "{{ .Values.selfapp.commit }}"
        path: '{{ `{{path}}` }}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ `{{path.basename}}` }}'
        helm:
          parameters:
          - name: "selfapp.sshkey"
            value: {{ .Values.selfapp.sshkey | quote }}
      syncPolicy:
        syncOptions:
          - CreateNamespace=true