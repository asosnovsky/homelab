---
apiVersion: v1
kind: Service
metadata:
  name: ldap
  labels:
    app.kubernetes.io/name: ldap
spec:
  type: ClusterIP
  ports:
    - name: tcp
      port: 1389
      targetPort: tcp
  selector:
    app.kubernetes.io/name: ldap
---
apiVersion: v1
kind: Service
metadata:
  name: phpldapadmin
  labels:
    app.kubernetes.io/name: phpldapadmin
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
  selector:
    app.kubernetes.io/name: phpldapadmin
