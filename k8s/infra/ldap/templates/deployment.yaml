---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ldap
  labels:
    app.kubernetes.io/name: ldap
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: ldap
  replicas: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ldap
    spec:
      volumes:
        - name: ldapdb
          persistentVolumeClaim:
            claimName: ldapdb
      containers:
        - name: ldap
          image: docker.io/bitnami/openldap:latest
          imagePullPolicy: "IfNotPresent"
          resources:
            limits:
              cpu: 1
              memory: "1Gi"
            requests:
              cpu: 0.5
              memory: "250Mi"
          volumeMounts:
            - name: ldapdb
              mountPath: /bitnami/openldap
          env:
            - name: LDAP_ORGANISATION
              value: "Home Cloud"
            - name: LDAP_DOMAIN
              value: "ldap.{{ .Values.global.domain }}"
            - name: LDAP_ROOT
              value: "dc=home,dc=sosnovsky,dc=ca"
            - name: LDAP_ADMIN_USERNAME
              value: "admin"
            - name: LDAP_SERVICE_HOST
              value: ldap.{{.Release.Namespace}}.svc.cluster.local
            - name: LDAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: adminpass
                  name: ldap-users
          ports:
            - name: tcp
              containerPort: 1389
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: phpldapadmin
  labels:
    app.kubernetes.io/name: phpldapadmin
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: phpldapadmin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: phpldapadmin
    spec:
      containers:
        - name: main
          image: osixia/phpldapadmin:0.9.0
          imagePullPolicy: IfNotPresent
          env:
            - name: PHPLDAPADMIN_LDAP_HOSTS
              value: ldap.{{.Release.Namespace}}.svc.cluster.local
            - name: PHPLDAPADMIN_HTTPS
              value: "false"
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          readinessProbe:
            initialDelaySeconds: 15
            httpGet:
              path: /
              port: http
          livenessProbe:
            initialDelaySeconds: 15
            httpGet:
              path: /
              port: http
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 100m
              memory: 128Mi
