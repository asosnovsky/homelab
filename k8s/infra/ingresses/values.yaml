reverseProxy: {}
services:
  - prefix: "argocd.core"
    service: "argocd-server"
    namespace: "argocd"
  - prefix: "demo"
    service: "dummy-app"
    namespace: "ingresses"
    middleware: "ingresses-chain-authelia"
  - prefix: "nextcloud"
    service: "nextcloud"
    namespace: "app-nextcloud"
    port: 8080
    middleware: "app-nextcloud-nextcloud"
  - prefix: "authentik.core"
    service: "authentik"
    namespace: "authentik"
    port: 80
  - prefix: "plex"
    service: "plex"
    namespace: "videohosting"
    port: 32400
global: {}
acmeServer: "https://acme-staging-v02.api.letsencrypt.org/directory"
skipTLSVerify: "false"
