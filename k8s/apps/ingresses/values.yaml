global:
  domain: "me.local"
  tls:
    enabled: false
reverseProxy: {}
services:
  - prefix: "argocd.core"
    service: "argocd-server"
    namespace: "argocd"
    group: "Core"
    icon: "assets/favicon/favicon-32x32.png"
  - prefix: "demo"
    service: "dummy-app"
    namespace: "apps-ingresses"
    middleware: "apps-ingresses-forwardauth-authentik"
    group: "Demo"
cloudflare:
  enabled: false
  tokenSecretName: ~
  tokenSecretKey: ~
  certificateRootDomains:
    - ""
    - ".core"
    - ".vh"
    - ".wa"