    - path: "index.html"
      content: |
        <h1>SkyG</h1>
        <h2>Site in Development</h2>
    - path: "data-deletion-policy"
      content: | 
          <html>

            <head>
                <title>Data Deletion Policy</title>
            </head>

            <body>
                <h1>Data Deletion Policy</h1>
                <p>This policy outlines the procedures for deleting data from our app, which helps host private events.</p>
                <h2>Data Retention</h2>
                <p>We retain data for a limited period of time, as outlined below:</p>
                <ul>
                    <li>Event data: We retain event data for a period of 1 year after the event has ended.</li>
                    <li>User data: We retain user data for a period of 1 year after the user's account is deactivated.</li>
                </ul>
                <h2>Data Deletion Requests</h2>
                <p>If you would like to request the deletion of your data, please email <a
                        href="mailto:ariel@sosnovsky.ca">ariel@sosnovsky.ca</a> with the following information:</p>
                <ul>
                    <li>Your name</li>
                    <li>Your email address</li>
                    <li>A description of the data you would like to have deleted</li>
                </ul>
                <p>We will respond to your request within 30 days and delete the requested data within 60 days.</p>
                <h2>Data Deletion Process</h2>
                <p>When we receive a data deletion request, we will:</p>
                <ol>
                    <li>Verify the identity of the requestor</li>
                    <li>Locate and identify the data to be deleted</li>
                    <li>Delete the data from our systems</li>
                    <li>Confirm the deletion to the requestor</li>
                </ol>
                <h2>Data Security</h2>
                <p>We take the security of your data seriously and have implemented measures to protect it from unauthorized access,
                    use, or disclosure. These measures include:</p>
                <ul>
                    <li>Data encryption</li>
                    <li>Access controls</li>
                    <li>Regular security audits</li>
                </ul>
                <h2>Contact Us</h2>
                <p>If you have any questions or concerns about this policy, please email <a
                        href="mailto:ariel@sosnovsky.ca">ariel@sosnovsky.ca</a>.</p>
            </body>

            </html>
    - path: "privacy-policy"
      content: |
            <html>
              <body>
              <h1>Privacy Policy</h1>

              <h2>Introduction</h2>

              SkyG is committed to protecting the privacy of our users. This privacy policy explains how we collect, use, and disclose information when you use our app to manage private events.

              <h2>Information We Collect</h2>

              When you create an account with us, we collect the following information:

              * Your name and email address
              * Your phone number (optional)
              * Your password (hashed for security)
              * Your event details, including title, date, time, location, and description

              We also collect information about your interactions with our app, including:

              * Your login and logout times
              * Your event creation and editing activities
              * Your RSVPs and attendance records
              * Your communication with other users through our app's messaging feature

              <h2>How We Use Your Information</h2>

              We use your information to provide and improve our app, including:

              * To create and manage your account
              * To send you notifications and updates about your events
              * To provide customer support and troubleshoot issues
              * To analyze usage patterns and improve our app's features and functionality
              * To comply with legal and regulatory requirements

              <h2>Sharing Your Information</h2>

              We do not share your personal information with third parties except in the following circumstances:

              * With your consent: We may share your information with third parties if you give us permission to do so.
              * To provide services: We may share your information with third-party service providers who help us provide our app, such as payment processors and event venue management systems.
              * To comply with law: We may share your information with law enforcement or other government agencies if required by law or if necessary to protect our users or our app.

              <h2>Security Measures</h2>

              We take the security of your information seriously. We use industry-standard encryption and secure servers to protect your data. We also implement access controls and other security measures to prevent unauthorized access to your information.

              <h2>Your Rights</h2>

              You have the right to:

              * Access your personal information: You can request a copy of your personal information from us.
              * Correct your personal information: You can request that we correct any inaccuracies in your personal information.
              * Delete your personal information: You can request that we delete your personal information, but please note that this may affect your ability to use our app.
              * Object to processing: You can object to our processing of your personal information, but please note that this may affect your ability to use our app.

              <h2>Changes to This Policy</h2>

              We may update this policy from time to time. We will notify you of any changes by email or through our app. Your continued use of our app after any changes to this policy will be considered acceptance of those changes.

              <h2>Contact Us</h2>

              If you have any questions or concerns about this policy, please contact us at [support email address].

              <h2>Effective Date</h2>

              This policy is effective as of June-24/2024.

              By using our app, you acknowledge that you have read, understood, and agree to be bound by this privacy policy.

              </body>
            </html>