{{  if .Values.global.tls.enabled  }}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
    name: {{ .Values.global.tls.issuer }}
spec:
    acme:
        server: {{ .Values.global.tls.acmeServer }}
        skipTLSVerify: {{ .Values.global.tls.skipTLSVerify }}
        email: {{ .Values.global.email }}
        privateKeySecretRef:
            name: {{ .Values.global.tls.issuer }}
        solvers:
            -   http01:
                    ingress:
                        class: traefik

{{ if .Values.cloudflare.enabled }}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: cloudflare
spec:
  acme:
    server: {{ .Values.global.tls.acmeServer }}
    skipTLSVerify: {{ .Values.global.tls.skipTLSVerify }}
    email: {{ .Values.global.email }}
    privateKeySecretRef:
        name: cloudflare
    solvers:
        -   dns01:
                cloudflare:
                    apiTokenSecretRef:
                        name: {{ .Values.cloudflare.apiKeySecretName }}
                        key: {{ .Values.cloudflare.apiKeySecretKey }}

{{ end }}
{{ end }}