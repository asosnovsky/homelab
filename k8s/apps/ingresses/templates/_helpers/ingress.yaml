{{- define "homelab.ingress" }}

# 
# Input:
#   prefix: str
#   service: str
#   namespace: str
#   global: map (should be .global)
#   port: int = 80
#   path: str = "/"
#   useWildCard: bool = False
#   middleware: str = "https-redirect"
# 

{{  if .global.tls.enabled  }}
{{ if (.useWildCard | default .global.tls.useWildCard) }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: "tls-{{.prefix}}.{{.global.domain}}"
  namespace: {{ .namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: apps-ingresses
  target:
    name: tls-{{.prefix}}.{{.global.domain}}
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    - secretKey: tls.crt
      remoteRef:
      {{ if hasSuffix ".core" .prefix }}
        key: cloudflare-wildcard.core.{{ .global.domain }}
      {{ else if hasSuffix ".vh" .prefix }}
        key: cloudflare-wildcard.vh.{{ .global.domain }}
      {{ else }}
        key: cloudflare-wildcard.{{ .global.domain }}
      {{ end }}
        property: tls.crt
    - secretKey: tls.key
      remoteRef:
      {{ if hasSuffix ".core" .prefix }}
        key: cloudflare-wildcard.core.{{ .global.domain }}
      {{ else if hasSuffix ".vh" .prefix }}
        key: cloudflare-wildcard.vh.{{ .global.domain }}
      {{ else }}
        key: cloudflare-wildcard.{{ .global.domain }}
      {{ end }}
        property: tls.key
{{ else }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: "tls-{{.prefix}}.{{.global.domain}}"
  namespace: {{ .namespace }}
spec:
  secretName: "tls-{{.prefix}}.{{.global.domain}}"
  issuerRef: 
    kind: ClusterIssuer
    name: "{{ .global.tls.issuer }}"
  commonName: "{{.prefix}}.{{.global.domain}}"
  dnsNames:
    - "{{.prefix}}.{{.global.domain}}"
{{ end }}
{{ end }}

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: "{{.prefix}}.{{.global.domain}}"
  namespace: {{ .namespace }}
  annotations:
    homelab-ingress/managing-app-namespace: "apps-ingresses"
    traefik.ingress.kubernetes.io/router.middlewares: {{ .middleware | default "apps-ingresses-https-redirect"}}@kubernetescrd
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "{{.prefix}}@{{.namespace}}"
    # gethomepage.dev/description: {{ .description | default "" }}
    gethomepage.dev/group: {{ .group | default "Unassigned" }}
    {{ if .icon }}
    gethomepage.dev/icon: "{{.icon}}"
    {{ else }}
    gethomepage.dev/icon: "homepage.png"
    {{ end }}
  {{ range $k, $v := (.annotations | default (dict )) }}
    {{ $k }}: {{ $v }}
  {{ end }}
spec:
  rules:
  - host: "{{.prefix}}.{{.global.domain}}"
    http:
      paths:
      - backend:
          service:
            name: "{{.service}}"
            port:
              number: {{.port | default 80}}
        path: {{ .path | default "/" }}
        pathType: Prefix
  {{ if .global.tls.enabled }}
  tls:
    - secretName: "tls-{{.prefix}}.{{.global.domain}}"
      hosts:
        - "{{.prefix}}.{{.global.domain}}"
  {{ end }}


{{- end -}}