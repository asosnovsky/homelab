{{- define "homelab.ingress" }}

# 
# Input:
#   prefix: str
#   service: str
#   namespace: str
#   global: map (should be .global)
#   port: int = 80
#   path: str = "/"
#   useWildCard: bool = False
#   middleware: str = "https-redirect"
# 

{{ $domain := (include "homelab.ingress.domain" .) }}

{{ $_ := set . "domain" $domain }}

{{  if .global.tls.enabled  }}
{{ include "homelab.ingress.domain.tls" . }}
{{ end }}

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: "{{ $domain }}"
  namespace: {{ .namespace }}
  annotations:
    homelab-ingress/managing-app-namespace: "apps-ingresses"
    traefik.ingress.kubernetes.io/router.middlewares: {{ .middleware | default "apps-ingresses-https-redirect"}}@kubernetescrd
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "{{.prefix}}@{{.namespace}}"
    gethomepage.dev/name: "{{.prefix}}@{{.namespace}}"
    gethomepage.dev/siteMonitor: 'http://{{.service}}.{{ .namespace }}.svc.cluster.local:{{.port | default 80}}{{ .path | default "/" }}{{ .health | default "" }}'
    # gethomepage.dev/description: {{ .description | default "" }}
    gethomepage.dev/group: {{ .group | default "Unassigned" }}
    {{ if .icon }}
    gethomepage.dev/icon: "{{.icon}}"
    {{ else }}
    gethomepage.dev/icon: "homepage.png"
    {{ end }}
  {{ range $k, $v := (.annotations | default (dict )) }}
    {{ $k }}: {{ $v }}
  {{ end }}
spec:
  rules:
  - host: "{{ $domain }}"
    http:
      paths:
      - backend:
          service:
            name: "{{.service}}"
            port:
              number: {{.port | default 80}}
        path: {{ .path | default "/" }}
        pathType: Prefix
  {{ if .global.tls.enabled }}
  tls:
    - secretName: "tls-{{ $domain }}"
      hosts:
        - "{{ $domain }}"
  {{ end }}
{{- end -}}