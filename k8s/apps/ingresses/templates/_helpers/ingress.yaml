{{- define "homelab.ingress" }}

# 
# Input:
#   prefix: str
#   service: str
#   namespace: str
#   global: map (should be .global)
#   port: int = 80
#   path: str = "/"
#   useWildCard: bool = False
#   middleware: str = "https-redirect"
# 
{{ if .useSecondaryDomain }}
{{ $domin := {{ .global.secondaryDomain }}  }}
{{ else }}
{{ $domin := {{ .global.domain }}  }}
{{ end }}

{{ if .useDirectPrefix }}
{{ $domin := printf "%s.%s" .prefix $domain }}
{{ else }}
{{ $domin := printf "%s.%s.%s" .prefix .rootSubDomain $domain }}
{{ end }}

{{  if .global.tls.enabled  }}
{{ if (.useWildCard | default .global.tls.useWildCard) }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: "tls-{{ $domin }}"
  namespace: {{ .namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: apps-ingresses
  target:
    name: tls-{{ $domin }}
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    - secretKey: tls.crt
      remoteRef:
        key: cloudflare-wildcard.{{ $domin }}
        property: tls.crt
    - secretKey: tls.key
      remoteRef:
        key: cloudflare-wildcard.{{ $domin }}
        property: tls.key
{{ else }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: "tls-{{ $domin }}"
  namespace: {{ .namespace }}
spec:
  secretName: "tls-{{ $domin }}"
  issuerRef: 
    kind: ClusterIssuer
    name: "{{ .global.tls.issuer }}"
  commonName: "{{ $domin }}"
  dnsNames:
    - "{{ $domin }}"
{{ end }}
{{ end }}

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: "{{ $domin }}"
  namespace: {{ .namespace }}
  annotations:
    homelab-ingress/managing-app-namespace: "apps-ingresses"
    traefik.ingress.kubernetes.io/router.middlewares: {{ .middleware | default "apps-ingresses-https-redirect"}}@kubernetescrd
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "{{.prefix}}@{{.namespace}}"
    gethomepage.dev/name: "{{.prefix}}@{{.namespace}}"
    gethomepage.dev/siteMonitor: 'http://{{.service}}.{{ .namespace }}.svc.cluster.local:{{.port | default 80}}{{ .path | default "/" }}{{ .health | default "" }}'
    # gethomepage.dev/description: {{ .description | default "" }}
    gethomepage.dev/group: {{ .group | default "Unassigned" }}
    {{ if .icon }}
    gethomepage.dev/icon: "{{.icon}}"
    {{ else }}
    gethomepage.dev/icon: "homepage.png"
    {{ end }}
  {{ range $k, $v := (.annotations | default (dict )) }}
    {{ $k }}: {{ $v }}
  {{ end }}
spec:
  rules:
  - host: "{{ $domin }}"
    http:
      paths:
      - backend:
          service:
            name: "{{.service}}"
            port:
              number: {{.port | default 80}}
        path: {{ .path | default "/" }}
        pathType: Prefix
  {{ if .global.tls.enabled }}
  tls:
    - secretName: "tls-{{ $domin }}"
      hosts:
        - "{{ $domin }}"
  {{ end }}

{{ else }}

{{ end }}

{{- end -}}