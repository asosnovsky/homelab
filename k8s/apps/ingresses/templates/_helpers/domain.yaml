{{- define "homelab.ingress.domain" -}}
  {{- $rootPrefix := (.leadPrefix | default "") -}}
  {{- if .useSecondaryDomain -}}
{{$rootPrefix}}{{.global.secondaryDomain}}
  {{- else -}}
    {{- if .useDirectPrefix -}}
{{$rootPrefix}}{{.global.domain}}
    {{- else -}}
{{$rootPrefix}}{{.global.rootSubDomain}}.{{.global.domain}}
    {{- end -}}
  {{- end -}}
{{- end -}}
