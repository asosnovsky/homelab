{{ range $staticFile := .Values.staticFiles.secondaryDomain }}

{{ $appLabel := replace "." "-" $staticFile.path }}
{{ $prefix := printf "sec-domain-%s" $appLabel }}

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: "{{$prefix}}-static-files"
data:
    index.html: |
      {{ $staticFile.content | nindent 6 }}

---
kind: Deployment
apiVersion: apps/v1
metadata:
    name: "{{$prefix}}-host"
    labels:
        app: "statis-files"
        path: {{ $appLabel }}
spec:
  replicas: 1
  selector:
    matchLabels:
        app: "statis-files"
        path: {{ $appLabel }}
  template:
    metadata:
      labels:
        app: "statis-files"
        path: {{ $appLabel }}
    spec:
        volumes:
            -   name: static-files
                configMap:
                    name: "{{$prefix}}-static-files"
        containers:
            -   name: api
                image: caddy:2.7-alpine
                command:
                    - caddy
                    - file-server
                    - --root
                    - /files
                    - --listen
                    - '0.0.0.0:80'
                volumeMounts:
                    -   mountPath: /files
                        name: static-files
                resources:
                    limits:
                        memory: 1Gi
                ports:
                    - containerPort: 80
---
kind: Service
apiVersion: v1
metadata:
    name: "{{$prefix}}-static-files"
    labels:
        app: "statis-files"
        path: {{ $appLabel }}
spec:
  selector:
        app: "statis-files"
        path: {{ $appLabel }}
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 80
{{ end }}

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: "sec-domain-static-files"
  annotations:
    homelab-ingress/managing-app-namespace: "apps-ingresses"
spec:
  rules:
  - host: "{{ $.Values.global.secondaryDomain }}"
    http:
      paths:
{{ range $staticFile := .Values.staticFiles.secondaryDomain }}
{{ $appLabel := replace "." "-" $staticFile.path }}
{{ $prefix := printf "sec-domain-%s" $appLabel }}
      - backend:
          service:
            name: "{{$prefix}}-static-files"
            port:
              number: 80
        path: "/{{$staticFile.path}}"
        pathType: Exact
{{ end }}
  {{ if $.Values.global.tls.enabled }}
  tls:
    - secretName: "tls-{{ $.Values.global.secondaryDomain }}"
      hosts:
        - "{{ $.Values.global.secondaryDomain }}"
  {{ end }}