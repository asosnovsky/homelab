    service: "argocd-server"
    namespace: "argocd"
    group: "Core"
    icon: "assets/favicon/favicon-32x32.png"
  - prefix: "demo"
    service: "dummy-app"
    namespace: "apps-ingresses"
    middleware: "apps-ingresses-forwardauth-authentik"
