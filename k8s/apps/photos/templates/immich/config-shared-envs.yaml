---
apiVersion: v1
kind: ConfigMap
metadata:
    name: immich-shared-envs
data:
    # general
    TZ: {{ $.Values.global.timezone }}
    LOG_LEVEL: log
    PUBLIC_LOGIN_PAGE_MESSAGE: Sosnovsky
    IMMICH_MEDIA_LOCATION: /shared/media/
    # ports
    SERVER_PORT: "{{ $.Values.immich.apps.server.port }}"
    MICROSERVICES_PORT: "{{ $.Values.immich.apps.microservices.port }}"
    MACHINE_LEARNING_PORT: "{{ $.Values.immich.apps.machineLearning.port }}"
    # db & redis
    REDIS_HOSTNAME: "immich-redis-headless.{{ $.Release.Namespace }}.svc.cluster.local"
    # typesense
    TYPESENSE_ENABLED: "true"
    TYPESENSE_HOST: "immich-typesense.{{ $.Release.Namespace }}.svc.cluster.local"
    TYPESENSE_PORT: "{{ $.Values.immich.apps.typesense.port }}"