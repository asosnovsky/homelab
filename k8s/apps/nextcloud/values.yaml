nextcloud:
  image:
    repository: "ghcr.io/asosnovsky/nextcloud"
    tag: "v1.1.0"
    pullPolicy: IfNotPresent
    flavor: fpm

  replicaCount: 2

  nodeSelector:
    homelab/capacity: high
  
  cronjob:
    resources:
      requests:
        cpu: "500m"
        memory: "1Gi"
        ephemeral-storage: "40Ki"
      limits:
        cpu: "1"
        memory: 5Gi
        ephemeral-storage: "40Mi"

  nextcloud:
    existingSecret:
      enabled: true
      secretName: "password.nextcloud.admin-initial"
      usernameKey: username
      passwordKey: password
    update: 1
    defaultConfigs:
      .htaccess: true
      redis.config.php: true
      apache-pretty-urls.config.php: true
      apcu.config.php: true
      apps.config.php: false
      autoconfig.php: true
      smtp.config.php: true
    strategy:
      type: RollingUpdate
      rollingUpdate:
        maxSurge: 1
        maxUnavailable: 0

  internalDatabase:
    enabled: false

  externalDatabase:
    enabled: true
    type: postgresql
    database: nextcloud
    host: changeme
    existingSecret:
      enabled: true
      secretName: password.pg.nextcloud
      usernameKey: username
      passwordKey: password

  redis:
    enabled: true
    auth:
      enabled: true

  cronjob:
    enabled: true

  persistence:
    enabled: true
    nextcloudData:
      enabled: true
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
      ephemeral-storage: "20Mi"
    limits:
      cpu: "3"
      memory: 5Gi
      ephemeral-storage: "200Mi"

  hpa:
    enabled: true
    cputhreshold: 60
    minPods: 1
    maxPods: 5

  nginx:
    enabled: true
    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
        ephemeral-storage: "100Ki"
      limits:
        cpu: "250m"
        memory: 1Gi
        ephemeral-storage: "100Mi"