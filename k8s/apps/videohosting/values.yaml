global:
  timezone: changeme
  nfs:
    storageClass: changeme
    server: changeme
    additionalShares:
      torrents: "changeme"
      familyvideos: "changeme"

jellyfin:
  enabled: false
  repo: "lscr.io/linuxserver/jellyfin"
  tag: latest
  resources:
    limits:
      memory: "14Gi"
    requests:
      cpu: 1
      memory: "4Gi"

arrs:
  sonarr:
    repo: lscr.io/linuxserver/sonarr
    tag: "latest"
    usePostgres: true
    podResources:
      limits:
        memory: "8Gi"
      requests:
        cpu: 250m
        memory: "500M"
    configVolumesResources:
      requests:
        storage: 10Gi
      limits:
        storage: 100Gi
    extraConfigXml: |-
      <InstanceName>Sosnovsky Sonarr</InstanceName>
      <AuthenticationMethod>External</AuthenticationMethod>
      <AuthenticationType>DisabledForLocalAddresses</AuthenticationType>

  radarr:
    repo: lscr.io/linuxserver/radarr
    tag: "latest"
    usePostgres: true
    podResources:
      limits:
        memory: "8Gi"
      requests:
        cpu: 250m
        memory: "500M"
    configVolumesResources:
      requests:
        storage: 10Gi
      limits:
        storage: 100Gi
    extraConfigXml: |-
      <InstanceName>Sosnovsky Radarr</InstanceName>
      <AuthenticationMethod>External</AuthenticationMethod>
      <AuthenticationType>DisabledForLocalAddresses</AuthenticationType>

  readarr:
    repo: lscr.io/linuxserver/readarr
    tag: "develop"
    usePostgres: true
    podResources:
      limits:
        memory: "8Gi"
      requests:
        cpu: 250m
        memory: "500M"
    configVolumesResources:
      requests:
        storage: 10Gi
      limits:
        storage: 100Gi
    extraConfigXml: |-
      <InstanceName>Sosnovsky Readarr</InstanceName>
      <AuthenticationType>DisabledForLocalAddresses</AuthenticationType>

  prowlarr:
    repo: lscr.io/linuxserver/prowlarr
    tag: "1.13.3.4273-ls54"
    usePostgres: true
    podResources:
      limits:
        memory: "8Gi"
      requests:
        cpu: 50m
        memory: "250M"
    configVolumesResources:
      requests:
        storage: 1Gi
      limits:
        storage: 10Gi
    extraConfigXml: |-
      <InstanceName>Sosnovsky Prowlarr</InstanceName>
      <AuthenticationMethod>External</AuthenticationMethod>
      <AuthenticationType>DisabledForLocalAddresses</AuthenticationType>

services:
  bazarr:
    kind: StatefulSet
    repo: lscr.io/linuxserver/bazarr
    tag: "v1.4.2-ls240"
    ports:
      tcp:
        web: 6767
    health: {}
    envFrom:
      - secretRef:
          name: bazarr-db-creds
    podResources:
      limits:
        memory: "8Gi"
      requests:
        cpu: 250m
        memory: "500M"
