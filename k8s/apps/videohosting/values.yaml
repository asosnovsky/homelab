global:
  timezone: changeme
  nfs:
    server: changeme
    additionalShares:
      torrents: "changeme"
      familyvideos: "changeme"
plex:
  repo: "plexinc/pms-docker"
  tag: "1.31.3.6868-28fc46b27"

linuxserverServices:
  # transmission:
  #   repo: lscr.io/linuxserver/transmission
  #   tag: "4.0.2"
  #   ports:
  #     tcp:
