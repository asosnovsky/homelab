global:
  timezone: changeme
  nfs:
    server: changeme
    additionalShares:
      torrents: "changeme"
      familyvideos: "changeme"
plex:
  repo: "plexinc/pms-docker"
  tag: "1.32.7.7621-871adbd44"
  resources: 
    limits:
      memory: "14Gi"
    requests:
      cpu: 3.5
      memory: "4Gi"
jellyfin:
  repo: "lscr.io/linuxserver/jellyfin"
  tag: latest
  resources: 
    limits:
      memory: "14Gi"
    requests:
      cpu: 1
      memory: "4Gi"

arrs:
  sonarr:
    repo: lscr.io/linuxserver/bazarr
    tag: "latest"
    migrateDbFromSqllite: 
      enabled: false
      claimName: config-sonarr-0
    usePostgres: true
    podResources:
      limits:
        memory: "8Gi"
      requests:
        cpu: 250m
        memory: "500M"
    configVolumesResources:
      requests:
        storage: 10Gi
      limits:
        storage: 100Gi
    extraConfigXml: |-
      <InstanceName>Sosnovsky Sonarr</InstanceName>
      <AuthenticationMethod>External</AuthenticationMethod>
      <AuthenticationType>DisabledForLocalAddresses</AuthenticationType>

  sonarr:
