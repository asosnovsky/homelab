global:
  timezone: changeme
  nfs:
    storageClass: changeme
    server: changeme
    additionalShares:
      torrents: "changeme"
      familyvideos: "changeme"
plex:
  repo: "plexinc/pms-docker"
  tag: "1.40.0.7998-c29d4c0c8"
  resources:
    limits:
      memory: "14Gi"
    requests:
      cpu: 3.5
      memory: "4Gi"

jellyfin:
  repo: "lscr.io/linuxserver/jellyfin"
  tag: latest
  resources:
    limits:
      memory: "14Gi"
    requests:
      cpu: 1
      memory: "4Gi"

abs:
  repo: ghcr.io/advplyr/audiobookshelf
  tag: latest
  resources:
    limits:
      memory: "4Gi"
    requests:
      cpu: 1
      memory: "4Gi"
  configVolumesResources:
    requests:
      storage: 10Gi
    limits:
      storage: 100Gi

arrs:
  sonarr:
    repo: lscr.io/linuxserver/sonarr
    tag: "latest"
    usePostgres: true
    podResources:
      limits:
        memory: "8Gi"
      requests:
        cpu: 250m
        memory: "500M"
    configVolumesResources:
      requests:
        storage: 10Gi
      limits:
        storage: 100Gi
    extraConfigXml: |-
      <InstanceName>Sosnovsky Sonarr</InstanceName>
      <AuthenticationMethod>External</AuthenticationMethod>
      <AuthenticationType>DisabledForLocalAddresses</AuthenticationType>

  radarr:
    repo: lscr.io/linuxserver/radarr
    tag: "latest"
    usePostgres: true
    podResources:
      limits:
        memory: "8Gi"
      requests:
        cpu: 250m
        memory: "500M"
    configVolumesResources:
      requests:
        storage: 10Gi
      limits:
        storage: 100Gi
    extraConfigXml: |-
      <InstanceName>Sosnovsky Radarr</InstanceName>
      <AuthenticationMethod>External</AuthenticationMethod>
      <AuthenticationType>DisabledForLocalAddresses</AuthenticationType>

  readarr:
    repo: lscr.io/linuxserver/readarr
    tag: "develop-0.3.30.2576-ls117"
    usePostgres: true
    podResources:
      limits:
        memory: "8Gi"
      requests:
        cpu: 250m
        memory: "500M"
    configVolumesResources:
      requests:
        storage: 10Gi
      limits:
        storage: 100Gi
    extraConfigXml: |-
      <InstanceName>Sosnovsky Readarr</InstanceName>
      <AuthenticationType>DisabledForLocalAddresses</AuthenticationType>

  prowlarr:
    repo: lscr.io/linuxserver/prowlarr
    tag: "1.13.3.4273-ls54"
    usePostgres: true
    podResources:
      limits:
        memory: "8Gi"
      requests:
        cpu: 50m
        memory: "250M"
    configVolumesResources:
      requests:
        storage: 1Gi
      limits:
        storage: 10Gi
    extraConfigXml: |-
      <InstanceName>Sosnovsky Prowlarr</InstanceName>
      <AuthenticationMethod>External</AuthenticationMethod>
      <AuthenticationType>DisabledForLocalAddresses</AuthenticationType>

services:
  bazarr:
    kind: StatefulSet
    repo: lscr.io/linuxserver/bazarr
    tag: "v1.4.2-ls240"
    ports:
      tcp:
        web: 6767
    health: {}
    envFrom:
      - secretRef:
          name: bazarr-db-creds
    podResources:
      limits:
        memory: "8Gi"
      requests:
        cpu: 250m
        memory: "500M"

  jellyplex:
    kind: Deployment
    disableSVC: true
    repo: "luigi311/jellyplex-watched"
    tag: "latest"
    envVars:
      PLEX_BASEURL: "http://plex.{{.Release.Namespace}}.svc.cluster.local:32400"
      JELLYFIN_BASEURL: "http://jellyfin.{{.Release.Namespace}}.svc.cluster.local:8096"
      SSL_BYPASS: "True"
      SYNC_FROM_PLEX_TO_JELLYFIN: "True"
      SYNC_FROM_JELLYFIN_TO_PLEX: "True"
      SYNC_FROM_PLEX_TO_PLEX: "True"
      SYNC_FROM_JELLYFIN_TO_JELLYFIN: "True"
      DRYRUN: "False"
    podResources:
      limits:
        memory: "500M"
      requests:
        cpu: 50m
        memory: "500M"
