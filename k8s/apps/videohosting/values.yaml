services:
  jellyplex:
    disableSVC: true
    repo: "luigi311/jellyplex-watched"
    tag: "latest"
    envVars:
      PLEX_BASEURL: "plex.{{.Release.Namespace}}.svc.cluster.local:32400"
      JELLYFIN_BASEURL: "jellyfin.{{.Release.Namespace}}.svc.cluster.local:8096"
      SSL_BYPASS: "True"
    podResources:
      limits:
        memory: "500M"
      requests:
        cpu: 50m
        memory: "500M"
  jackett:
    disabled: true
    repo: lscr.io/linuxserver/jackett
    tag: "latest"
    envVars:
      AUTO_UPDATE: "true"
    podResources:
      limits:
        memory: "1Gi"
      requests:
        cpu: 250m
        memory: "500M"
    health:
      readiness: "/health"
      liveness: "/health"
    configVolumesResources:
      requests:
        storage: 10Gi
      limits:
        storage: 100Gi
    ports:
      tcp:
        web: 9117
  qbittorrent:
    repo: linuxserver/qbittorrent
    tag: libtorrentv1
    ports:
      tcp:
        web: 8080
        6881: 6881
      udp:
        6881: 6881
    podResources:
      limits:
        memory: "6Gi"
      requests:
        cpu: 800m
        memory: "4Gi"
    health: {}
    configVolumesResources:
      requests:
        storage: 10Gi
      limits:
        storage: 100Gi
