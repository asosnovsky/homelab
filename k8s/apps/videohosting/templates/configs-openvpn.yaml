---
apiVersion: v1
kind: Secret
metadata:
  name: openvpn-creds
type: Opaque
data:
  _placeholder: ""

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openvpn-route-script
data:
  route-override.sh: |-
     #!/bin/sh
     VPN_GATEWAY=$(route -n | awk 'NR==3' | awk '{ print $2 }')
     ip route del 0.0.0.0/1 via $VPN_GATEWAY
     echo "Route Updated"