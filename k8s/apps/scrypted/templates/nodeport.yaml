{{ if .Values.flags.enableNodePort }}
---
kind: Service
apiVersion: v1
metadata:
  name: {{ .Release.Name }}-nodeport
spec:
  selector:
    {{ .Release.Name }}/app: scrypted
  type: NodePort
  ports:
    -   port: 443
        targetPort: 10443
        name: https
        protocol: TCP
    -   port: 80
        targetPort: 11080
        name: http
        protocol: TCP
{{ end }}