---
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: "user-generation-tf"
  namespace: "{{ .Release.Namespace }}"
data:
    run.sh: "{{ include "pg-users.entry" . | b64enc }}"
    main.tf: "{{ include "pg-users.terraform" . | b64enc }}"
    users.tfvars: "{{ (print "db_users = " ( .Values.userGeneration.users | toJson  )) | b64enc }}"
    db_users_dbs.tfvars: "{{ (print "db_users_dbs = " ( .Values.userGeneration.users_dbs | toJson  )) | b64enc }}"
