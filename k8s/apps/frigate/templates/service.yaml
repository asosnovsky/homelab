---
kind: Service
apiVersion: v1
metadata:
  name: frigate
spec:
  selector:
    homelab/app: frigate
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 5000
      name: http
      protocol: TCP
    - port: 8554
      targetPort: 8554
      name: rtsp
      protocol: TCP
    - port: 8555
      targetPort: 8555
      name: webrtc-tcp
      protocol: TCP
    - port: 8555
      targetPort: 8555
      name: webrtc-udp
      protocol: UDP
---
kind: Service
apiVersion: v1
metadata:
  name: go2rtc
spec:
  selector:
    homelab/app: go2rtc
  type: ClusterIP
  ports:
    - port: 8554
      targetPort: 8554
      name: rtsp
      protocol: TCP
    - port: 8555
      targetPort: 8555
      name: webrtc-tcp
      protocol: TCP
    - port: 8555
      targetPort: 8555
      name: webrtc-udp
      protocol: UDP
    - port: 80
      targetPort: 1984
      name: http
      protocol: TCP
---
kind: Service
apiVersion: v1
metadata:
  name: scrypted
spec:
  selector:
    homelab/app: scrypted
  type: ClusterIP
  ports:
    - port: 554
      targetPort: 554
      name: rtsp-tcp
      protocol: TCP
    - port: 554
      targetPort: 554
      name: rtsp-udp
      protocol: UDP
    - port: 80
      targetPort: 80
      name: http
      protocol: TCP
    - port: 443
      targetPort: 443
      name: https
      protocol: TCP
    - port: 47524
      targetPort: 47524
      name: homekit
      