---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: "frigate"
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      homelab/app: frigate
  template:
    metadata:
      labels:
        homelab/app: frigate
    spec:
      {{- if .Values.nodeSelector }}
      nodeSelector: 
        {{- .Values.nodeSelector | toYaml | nindent 8}}
      {{- end }}
      volumes:
        {{- if .Values.persistence.media_path.enabled }}
        -   name: media-path
            persistentVolumeClaim:
              claimName: {{ .Values.persistence.media_path.claimName }}
        {{- end }}
        {{- if .Values.persistence.conf_path.enabled }}
        -   name: conf-path
            persistentVolumeClaim:
              claimName: {{ .Values.persistence.conf_path.claimName }}
        {{- end }}
        {{- if .Values.coral.enabled }}
        -   name: coral-dev
            hostPath:
              path: {{ .Values.coral.hostPath }}
        {{- end }}
        -   name: dshm
            emptyDir:
              medium: Memory
      containers:
        -   name: frigate
            imagePullPolicy: "Always"
            securityContext:
              privileged: true
            image: "{{ .Values.images.frigate.repo }}:{{ .Values.images.frigate.tag | default .Chart.AppVersion }}"
            resources: 
              {{- .Values.resources.frigate | toYaml | nindent 14}}
            livenessProbe:
              httpGet:
                path: /
                port: http
                scheme: HTTP
              initialDelaySeconds: 10
              failureThreshold: 10
              timeoutSeconds: 30
            readinessProbe:
              httpGet:
                path: /
                port: http
                scheme: HTTP
              initialDelaySeconds: 10
              failureThreshold: 10
              timeoutSeconds: 30
            startupProbe:
              httpGet:
                path: /
                port: http
                scheme: HTTP
              failureThreshold: 60
              periodSeconds: 15
            ports:
              -   containerPort: 5000
                  name: http
              -   containerPort: 8554
                  name: rtsp
              -   containerPort: 8555
                  name: webrtc-tcp
                  protocol: TCP
              -   containerPort: 8555
                  name: webrtc-udp
                  protocol: UDP
            volumeMounts:
        {{- if .Values.persistence.media_path.enabled }}
              -   name: media-path
                  mountPath: /media/frigate
        {{ end }}
        {{- if .Values.persistence.conf_path.enabled }}
              -   name: conf-path
                  mountPath: /config
                  subPath: frigate
        {{ end }}
        {{- if .Values.coral.enabled }}
              -   mountPath: {{ .Values.coral.hostPath }}
                  name: coral-dev
        {{- end }}
              -   mountPath: /dev/shm
                  name: dshm
