---
kind: Service
apiVersion: v1
metadata:
  name: go2rtc-lb
spec:
  selector:
    homelab/app: go2rtc
  type: LoadBalancer
  ports:
    - port: 8554
      targetPort: 8554
      name: rtsp
      protocol: TCP
    - port: 8555
      targetPort: 8555
      name: webrtc-tcp
      protocol: TCP
    - port: 8555
      targetPort: 8555
      name: webrtc-udp
      protocol: UDP
    - port: 1984
      targetPort: 1984
      name: http
      protocol: TCP
---
kind: Service
apiVersion: v1
metadata:
  name: scrypted-lb
spec:
  selector:
    homelab/app: scrypted
  type: LoadBalancer
  ports:
    -   port: 554
        targetPort: 554
        name: rtsp-tcp
        protocol: TCP
    -   port: 554
        targetPort: 554
        name: rtsp-udp
        protocol: UDP
{{ with .Values.scrypted.homekit }}
  {{ range $i := (untilStep (int .startPort) (int .endPort) 1) }}
    -   port: "{{$i}}"
        targetPort: "{{$i}}"
        name: homekit-{{$i}}
  {{ end }}
{{ end }}