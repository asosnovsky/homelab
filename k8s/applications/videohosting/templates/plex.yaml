apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: plex
spec:
  selector:
    matchLabels:
      app: plex
  serviceName: plex
  replicas: 2
  template:
    metadata:
      labels:
        app: plex
    spec:
      containers:
        - name: plex
          image: lscr.io/linuxserver/plex:1.31.3
          ports:
            - containerPort: 32400
              name: plex
            - containerPort: 1900
              protocol: UDP
            - containerPort: 3005
            - containerPort: 5353
              protocol: UDP
            - containerPort: 8324
            - containerPort: 32410
              protocol: UDP
            - containerPort: 32412
              protocol: UDP
            - containerPort: 32413
              protocol: UDP
            - containerPort: 32414
              protocol: UDP
            - containerPort: 32469
          volumeMounts:
            - name: family-videos
              mountPath: /mnt/family-videos
            - name: torrents
              mountPath: /mnt/torrents
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: America/Toronto
      volumes:
        - name: torrents
          nfs:
          server: "{{.Values.nfs.server}}"
          path: "{{ .Values.nfs.shares.torrent }}"
          readOnly: true
        - name: family-videos
          nfs:
          server: "{{.Values.nfs.server}}"
          path: "{{ .Values.nfs.shares.familyVideos }}"
          readOnly: true
