---
kind: Service
apiVersion: v1
metadata:
  name: plex
spec:
  selector:
    app: plex
  type: ClusterIP
  ports:
    - port: 32400
      targetPort: 32400
      name: plex
    - port: 1900
      targetPort: 1900
      name: "1900"
      protocol: UDP
    - port: 3005
      targetPort: 3005
      name: "3005"
    - port: 5353
      targetPort: 5353
      name: "5353"
      protocol: UDP
    - port: 8324
      targetPort: 8324
      name: "8324"
    - port: 32410
      targetPort: 32410
      name: "32410"
      protocol: UDP
    - port: 32412
      targetPort: 32412
      name: "32412"
      protocol: UDP
    - port: 32413
      targetPort: 32413
      name: "32413"
      protocol: UDP
    - port: 32414
      targetPort: 32414
      name: "32414"
      protocol: UDP
    - port: 32469
      targetPort: 32469
      name: "32469"
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: plex
spec:
  selector:
    matchLabels:
      app: plex
  serviceName: plex
  replicas: 2
  revisionHistoryLimit: 2
  template:
    metadata:
      labels:
        app: plex
    spec:
      containers:
        - name: plex
          image: lscr.io/linuxserver/plex:1.31.3
          ports:
            - containerPort: 32400
              name: plex
            - containerPort: 1900
              protocol: UDP
            - containerPort: 3005
            - containerPort: 5353
              protocol: UDP
            - containerPort: 8324
            - containerPort: 32410
              protocol: UDP
            - containerPort: 32412
              protocol: UDP
            - containerPort: 32413
              protocol: UDP
            - containerPort: 32414
              protocol: UDP
            - containerPort: 32469
          volumeMounts:
            - name: family-videos
              mountPath: /mnt/family-videos
            - name: torrents
              mountPath: /mnt/torrents
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: America/Toronto
      volumes:
        - name: torrents
          nfs:
            server: "{{.Values.nfs.server}}"
            path: "{{ .Values.nfs.shares.torrent }}"
            readOnly: true
        - name: family-videos
          nfs:
            server: "{{.Values.nfs.server}}"
            path: "{{ .Values.nfs.shares.familyVideos }}"
            readOnly: true
