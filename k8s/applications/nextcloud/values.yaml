nextcloud:
  image:
    repository: "ghcr.io/asosnovsky/nextcloud"
    tag: "v1.1.0"
    pullPolicy: IfNotPresent
    flavor: fpm

  replicaCount: 2

  nextcloud:
    existingSecret:
      enabled: true
      secretName: "password.nextcloud.admin-initial"
      usernameKey: username
      passwordKey: password
    update: 0
    defaultConfigs:
      .htaccess: true
      redis.config.php: true
      apache-pretty-urls.config.php: true
      apcu.config.php: true
      apps.config.php: false
      autoconfig.php: true
      smtp.config.php: true
    configs:
      proxy.config.php: |-
        <?php
        $CONFIG = array (
          'trusted_proxies' => array(
            0 => '127.0.0.1',
            1 => '10.0.0.0/8',
          ),
          'overwritehost'     => 'ssl-proxy.tld',
          'overwriteprotocol' => 'https',
          'overwritewebroot'  => '/domain.tld/nextcloud',
          'forwarded_for_headers' => array('HTTP_X_FORWARDED_FOR'),
        );
    strategy:
      type: RollingUpdate
      rollingUpdate:
        maxSurge: 1
        maxUnavailable: 0

  internalDatabase:
    enabled: false

  externalDatabase:
    enabled: true
    type: postgresql
    database: nextcloud
    host: postgres.database.svc.cluster.local
    existingSecret:
      enabled: true
      secretName: password.pg.nextcloud
      usernameKey: username
      passwordKey: password

  redis:
    enabled: true
    auth:
      enabled: true

  cronjob:
    enabled: true

  persistence:
    enabled: true
    nextcloudData:
      storageClass: "nfs-generic"
      enabled: true
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "3"
      memory: 5Gi

  hpa:
    enabled: true
    cputhreshold: 60
    minPods: 1
    maxPods: 5

  nginx:
    enabled: true
