{{- if .Values.secrets.ingresses.secrets.cloudflare }}
cloudflare:
  enabled: true
  tokenSecretName: {{ .Values.secrets.ingresses.secrets.cloudflare.name }}
  tokenSecretKey: api-token
{{- end }}
services:
  # core services
  - prefix: "argocd.core"
    service: "argocd-server"
    namespace: "argocd"
    group: "Core"
    icon: "https://argocd.core.home.sosnovsky.ca/assets/favicon/favicon-32x32.png"
  - prefix: "rancher.core"
    service: "rancher"
    namespace: "chart-rancher"
    group: "Core"
    icon: "https://rancher.core.home.sosnovsky.ca/favicon.png"
  - prefix: "monitoring.core"
    service: prometheus-kube-prometheus-prometheus
    namespace: chart-prometheus
    middleware: "apps-ingresses-chain-authentik"
    group: "Core"
    icon: "https://monitoring.core.home.sosnovsky.ca/favicon.ico"
    port: 9090
  - prefix: "alerts.core"
    service: prometheus-kube-prometheus-alertmanager
    namespace: chart-prometheus
    middleware: "apps-ingresses-chain-authentik"
    group: "Core"
    port: 9093
  - prefix: "grafana.core"
    service: prometheus-grafana
    namespace: chart-prometheus
    middleware: "apps-ingresses-chain-authentik"
    group: "Core"
    icon: "https://grafana.core.home.sosnovsky.ca/public/img/fav32.png"
  - prefix: "authentik.core"
    service: "authentik"
    namespace: "chart-authentik"
    group: "Core"
    icon: "https://authentik.core.home.sosnovsky.ca/static/dist/assets/icons/icon.png"
  # root services
  - prefix: "demo"
    service: "dummy-app"
    namespace: "apps-ingresses"
    middleware: "apps-ingresses-chain-authentik"
    group: "Demo"
    # icon: "data:image/png;base64,"
  - prefix: "nextcloud"
    service: "nextcloud"
    namespace: "apps-nextcloud"
    port: 8080
    middleware: "apps-nextcloud-nextcloud"
    group: "Apps"
    icon: "https://nextcloud.home.sosnovsky.ca/core/img/favicon.ico"
  - prefix: "plex"
    service: "plex"
    namespace: "apps-videohosting"
    port: 32400
    group: "Apps"
    icon: "https://plex.home.sosnovsky.ca/web/favicon.ico"
  - prefix: "frigate"
    service: "frigate"
    namespace: "apps-frigate"
    middleware: "apps-ingresses-chain-authentik"
    group: "Cameras"
    icon: "https://frigate.home.sosnovsky.ca/assets/favicon-92a9ac8b.ico"
  - prefix: "go2rtc"
    service: "go2rtc"
    namespace: "apps-frigate"
    middleware: "apps-ingresses-chain-authentik"
    group: "Cameras"
    icon: "https://frigate.home.sosnovsky.ca/assets/favicon-92a9ac8b.ico"
  - prefix: "main"
    service: "homepage"
    namespace: "chart-homepage"
    middleware: "apps-ingresses-chain-authentik"
    port: 3000
    group: "Core"
  # vh services
  {{- range $k, $v := .Values.videohosting.linuxserverServices }}
  - prefix: "{{ $k }}.vh"
    service: "{{ $k }}"
    namespace: "apps-videohosting"
    port: {{ $v.ports.tcp.web }}
    middleware: "apps-ingresses-chain-authentik"
    group: "Video Hosting"
  {{- end }}