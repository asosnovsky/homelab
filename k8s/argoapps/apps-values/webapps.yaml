app:
  quirky:
    ingress:
        middleware: apps-ingresses-https-redirect
    repo: ghcr.io/asosnovsky/quirky
    tag: "latest"
    podResources:
      limits:
        memory: "250Mi"
      requests:
        cpu: 250m
        memory: "250Mi"
    health:
      readiness: "/"
      liveness: "/"
    ports:
      tcp:
        web: 80
    capacity:
      - med
      - low