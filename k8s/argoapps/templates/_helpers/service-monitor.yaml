{{ define "homelab.prom.svcm" }}
---
apiVersion: v1
kind: Endpoints
metadata:
  name: "rp-metrics-{{.name}}"
  labels:
    app.kubernetes.io/name: rp-metrics
    app.kubernetes.io/instance: {{ .name }}
subsets:
- addresses:
  - ip: "{{ .ip }}"
  ports:
  - port: {{ .port | default 80 }}
    protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: "rp-metrics-{{.name}}"
  labels:
    app.kubernetes.io/name: rp-metrics
    app.kubernetes.io/instance: {{ .name }}
spec:
  type: ClusterIP
  ports:
  - port: 80
    protocol: TCP
    targetPort: {{ .port | default 9100 }}
{{ end }}