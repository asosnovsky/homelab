{{ range $_, $secretsData := $appvalues.secrets }}
---
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: {{ $secretsData.namespace }}
spec:
  provider:
    kubernetes:
      remoteNamespace: {{ $secretsData.namespace }}
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
          namespace: {{ $secretsData.namespace }}
      auth:
        serviceAccount:
          name: {{ $secretsData.namespace }}
          namespace: {{ $secretsData.namespace }}


{{ range $key, $value := $secretsData.secrets }}
---
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: {{ $value.name }}
  namespace: {{ $secretsData.namespace }}
  annotations:
    homelab-secret/type: "externally-filled"
data:
  _placeholder: ""
{{ end }}

{{ end }}
