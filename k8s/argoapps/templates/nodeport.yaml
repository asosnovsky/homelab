---
kind: Service
apiVersion: v1
metadata:
  name: nodeport
  namespace: chart-database
spec:
  selector:
    app.kubernetes.io/component: primary
    app.kubernetes.io/instance: database
    app.kubernetes.io/name: postgresql
  type: NodePort
  ports:
    -   name: tcp-postgresql
        port: 5432
        protocol: TCP
        targetPort: tcp-postgresql
        nodePort: 35432
