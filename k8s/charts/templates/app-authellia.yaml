---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: "authelia"
  namespace: "{{ .Release.Namespace }}"
spec:
  project: meta-infrastructure
  source:
    chart: authelia
    repoURL: "https://charts.authelia.com"
    targetRevision: "0.8.57"
    helm:
      releaseName: authelia
      values: |-
        domain: auth.{{ .Values.global.domain }}
  destination:
    server: https://kubernetes.default.svc
    namespace: "authelia"
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
