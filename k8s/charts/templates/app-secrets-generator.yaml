---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: "kubernetes-secret-generator"
  namespace: "{{ .Release.Namespace }}"
spec:
  project: meta-infrastructure
  source:
    chart: kubernetes-secret-generator
    repoURL: "https://helm.mittwald.de"
    targetRevision: "{{ .Values.chartVersions.kubernetesSecretGenerator }}"
    helm:
      releaseName: kubernetes-secret-generator
  destination:
    server: https://kubernetes.default.svc
    namespace: "kubernetes-secret-generator"
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
