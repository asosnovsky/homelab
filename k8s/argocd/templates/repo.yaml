---
apiVersion: v1
kind: Secret
metadata:
  name: argo-repo-main
  namespace: "{{ .Release.Namespace }}"
  labels:
    argocd.argoproj.io/secret-type: repository
  annotations:
    link.argocd.argoproj.io/external-link: "https://github.com/{{ .Values.selfapp.repo }}"
stringData:
  type: git
  url: "git@github.com:{{ .Values.selfapp.repo }}.git"
  sshPrivateKey: {{ .Values.selfapp.sshkey | quote }}