{{- if .Values.selfapp.enabled -}}
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: infrastructure
  namespace: "{{ .Release.Namespace }}"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: "infrastructure services"
  orphanedResources:
    warn: true
  sourceRepos:
    - "git@github.com:{{ .Values.selfapp.repo }}.git"
  destinations:
    - server: "*"
      namespace: '*'
      name: '*'
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
{{- end -}}