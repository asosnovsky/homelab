{{- if .Values.selfapp.enabled -}}
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: services
  namespace: "{{ .Release.Namespace }}"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: services
  sourceRepos:
  - '*'
  destinations:
  - server: https://kubernetes.default.svc
    namespace: '*'
    name: '*'
{{- end -}}