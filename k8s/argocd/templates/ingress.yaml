---
apiVersion: v1
items:
  - apiVersion: networking.k8s.io/v1
    kind: Ingress
    metadata:
      name: argocd-server-grpc
      namespace: argocd
    spec:
      rules:
        - http:
            paths:
              - backend:
                  service:
                    name: argocd-server
                    port:
                      number: 80
                path: /
                pathType: Prefix
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-server
  namespace: argocd
spec:
  rules:
    - http:
        paths:
          - backend:
              service:
                name: argocd-server
                port:
                  number: 443
            path: /argocd
            pathType: Prefix
