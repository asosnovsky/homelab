{{- if .Values.selfapp.enabled -}}
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
    name: "infra"
spec:
    generators:
        -   git:
                repoURL: "git@github.com:{{ .Values.selfapp.repo }}.git"
                revision: "{{ .Values.selfapp.commit }}"
                directories:
                    -   path: k8s/infra/*
    template:
        metadata:
            name: '{{ `{{path.basename}}` }}'
        spec:
            project: "infra"
            source:
                repoURL: "git@github.com:{{ .Values.selfapp.repo }}.git"
                targetRevision: "{{ .Values.selfapp.commit }}"
                path: '{{ `{{path}}` }}'
            destination:
                server: https://kubernetes.default.svc
                namespace: '{{ `{{path.basename}}` }}'
{{- end -}}


