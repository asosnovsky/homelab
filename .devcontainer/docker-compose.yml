version: '3'

services:
  app:
    network_mode: host
    build:
      context: .
      dockerfile: Dockerfile

    volumes:
      - /var/run/docker.sock:/var/run/docker-host.sock
      - ../..:/workspaces:cached
      - "~/.ssh:/home/vscode/.ssh"
      - "~/.gitconfig:/home/vscode/.gitconfig"

    entrypoint: /usr/local/share/docker-init.sh
    command: sleep infinity
    environment:
      - KUBE_EDITOR="code -w"